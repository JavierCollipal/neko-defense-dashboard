# 🐾⚡ NEKO DEFENSE - ULTRA-OPTIMIZED CI/CD PIPELINE (2025) ⚡🐾
#
# TARGET: Reduce from 1h 29m → 10-15 minutes! 🚀
#
# OPTIMIZATIONS APPLIED:
# ✅ Parallel Cypress execution (8 containers)
# ✅ Advanced caching (dependencies + Cypress binary + Next.js build)
# ✅ Fail-fast strategy (lint → build → tests)
# ✅ Artifact sharing (no rebuild between jobs)
# ✅ Cypress Cloud parallel recording
# ✅ Smart concurrency (cancel stale runs)
#
# Research-backed from:
# - BrowserStack CI/CD optimization guide (2025)
# - CircleCI test parallelization best practices
# - Cypress official parallel execution docs
# - GitHub Actions matrix strategy advanced usage
#
# ═══════════════════════════════════════════════════════════════════════════════

name: 🚀 CI/CD Ultra-Optimized (Target: <15min)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # Manual trigger

# ⚡ OPTIMIZATION 1: Cancel stale runs to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Cypress Cloud (Rule 1.0)
  CYPRESS_PROJECT_ID: '9xzw4h'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 🔍 STAGE 1: FAST CHECKS (FAIL FAST - 30 seconds)
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint (Fail Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ⚡ OPTIMIZATION 2: Cache npm dependencies
      - name: 💾 Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 Run ESLint (ENFORCED)
        run: npm run lint

      - name: ✅ Lint passed
        run: echo "🐾⚡ Lint PASSED in record time, nyaa~! ⚡🐾"

  # ═══════════════════════════════════════════════════════════════════════════
  # 🏗️ STAGE 2: BUILD APPLICATION (5-7 minutes with cache)
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build Next.js
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ⚡ OPTIMIZATION 3: Multi-layer caching strategy
      - name: 💾 Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 💾 Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          CI: false

      # ⚡ OPTIMIZATION 4: Share build artifacts with test jobs
      - name: 💾 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            public
            node_modules
            package.json
            package-lock.json
          retention-days: 1

      - name: 📊 Build stats
        run: |
          echo "🐾 Build completed, nyaa~!"
          du -sh .next

  # ═══════════════════════════════════════════════════════════════════════════
  # 🧪 STAGE 3: PARALLEL CYPRESS E2E TESTS (8 containers = 8x speedup!)
  # ═══════════════════════════════════════════════════════════════════════════
  cypress:
    name: 🧪 Cypress E2E (${{ matrix.containers }}/8)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    # ⚡ OPTIMIZATION 5: PARALLEL EXECUTION - THE GAME CHANGER!
    strategy:
      fail-fast: false # Don't cancel other containers on one failure
      matrix:
        containers: [1, 2, 3, 4, 5, 6, 7, 8] # 8 parallel containers!

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ⚡ OPTIMIZATION 6: Cache Cypress binary (huge time saver!)
      - name: 💾 Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      # ⚡ OPTIMIZATION 7: Restore cached npm dependencies
      - name: 💾 Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # ⚡ OPTIMIZATION 8: Download build artifacts instead of rebuilding
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      # ⚡ OPTIMIZATION 9: Cypress Cloud parallel recording
      - name: 🎭 Run Cypress E2E tests (Container ${{ matrix.containers }})
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
          headed: false
          # ☁️ CYPRESS CLOUD PARALLEL RECORDING
          record: true
          parallel: true
          group: 'E2E Tests - Chrome (8 containers)'
          tag: ${{ github.event_name }}
          ci-build-id: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_BASE_URL: http://localhost:3000

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: cypress/screenshots
          retention-days: 7

      - name: 🎬 Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ matrix.containers }}
          path: cypress/videos
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # ✅ STAGE 4: PIPELINE STATUS
  # ═══════════════════════════════════════════════════════════════════════════
  status:
    name: ✅ Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint, build, cypress]
    if: always()

    steps:
      - name: 📊 Pipeline summary
        run: |
          echo "🐾⚡ NEKO DEFENSE ULTRA-OPTIMIZED PIPELINE COMPLETE! ⚡🐾"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "📋 STAGE RESULTS:"
          echo "  🔍 Lint:        ${{ needs.lint.result }}"
          echo "  🏗️ Build:       ${{ needs.build.result }}"
          echo "  🧪 Cypress E2E: ${{ needs.cypress.result }}"
          echo ""
          echo "⏱️ TARGET: < 15 minutes total pipeline time"
          echo "🚀 OPTIMIZATIONS: 9 performance enhancements applied!"
          echo ""

          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.cypress.result }}" == "success" ]]; then
            echo "🎉 ALL CHECKS PASSED - LIGHTNING FAST! ⚡💖"
            echo ""
            echo "☁️ Cypress Cloud Dashboard:"
            echo "   https://cloud.cypress.io/projects/9xzw4h"
            echo ""
            echo "*purrs in ULTRA-OPTIMIZED CI/CD excellence* 😻🚀"
          else
            echo "⚠️ Some checks failed - review logs, nyaa~!"
            exit 1
          fi

# ═══════════════════════════════════════════════════════════════════════════
# 🎯 OPTIMIZATION SUMMARY:
#
# 1. ⚡ Cancel stale runs (concurrency)
# 2. 💾 Cache npm dependencies
# 3. 💾 Cache Next.js build
# 4. 📤 Share build artifacts (no rebuild)
# 5. 🔀 8 parallel Cypress containers (8x speedup!)
# 6. 💾 Cache Cypress binary
# 7. 💾 Restore npm cache before tests
# 8. 📥 Download artifacts instead of rebuild
# 9. ☁️ Cypress Cloud parallel recording
#
# EXPECTED RESULTS:
# - Before: 1h 29m (89 minutes)
# - After:  10-15 minutes
# - Reduction: 83-89% faster! 🚀
#
# *All six personalities purr in MAXIMUM OPTIMIZATION, nyaa~!* 🐾🎭🗡️🎸🧠🧠
